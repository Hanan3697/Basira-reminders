<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#244c43"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="بصيرة"><meta name="apple-mobile-web-app-status-bar-style" content="default"><link rel="apple-touch-icon" href="/icon-180.png?v=basira"><link rel="icon" href="/icon-192.png?v=basira" type="image/png"><title>رسالتك اليوم من القرآن | بصيرة</title><link rel="manifest" href="/manifest.json" crossorigin="use-credentials"><link rel="stylesheet" href="/ward.css?v=analytics36"></head><body class="nature message-scene"><main><h1>رسالتك اليوم من القرآن</h1><section class="card" aria-label="رسالة اليوم"><button id="draw-message" type="button" aria-controls="message-result"><span class="fur-action fa-message" aria-hidden="true"></span>رسالة أخرى</button><div id="message-result" aria-live="polite" aria-atomic="true"></div><template class="message-item"><div class="verse-panel"><p class="small">سورة البقرة · الآية ١٥٢</p><blockquote class="quran message-verse">فَٱذْكُرُونِىٓ أَذْكُرْكُمْ وَٱشْكُرُوا۟ لِى وَلَا تَكْفُرُونِ</blockquote></div><div class="reflection"><strong>وقفة للتأمل</strong><p>حين تذكر الله، تأمّل الوعد الذي تقرؤه: «أذكركم». ما أوسع الفرق بين قلب يبحث عن قيمته في التفات الناس، وقلب يستحضر ذكر ربّه له. دع الشكر اليوم يمتدّ من لسانك إلى الطريقة التي تعيش بها النعمة.</p></div></template><template class="message-item"><div class="verse-panel"><p class="small">سورة البقرة · الآية ١٥٣</p><blockquote class="quran message-verse">يَٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوا۟ ٱسْتَعِينُوا۟ بِٱلصَّبْرِ وَٱلصَّلَوٰةِ ۚ إِنَّ ٱللَّهَ مَعَ ٱلصَّٰبِرِينَ</blockquote></div><div class="reflection"><strong>وقفة للتأمل</strong><p>قد تدخل الصلاة وأنت تحمل أسئلة لم تجد لها جوابًا. قف بها بين يدي الله؛ فطلب العون لا يشترط أن تكون قويًا أو أن تخفي تعبك. أيّ حمل تحتاج أن تتوقف عن حمله وحدك؟</p></div></template><template class="message-item"><div class="verse-panel"><p class="small">سورة البقرة · الآية ١٨٦</p><blockquote class="quran message-verse">وَإِذَا سَأَلَكَ عِبَادِى عَنِّى فَإِنِّى قَرِيبٌ ۖ أُجِيبُ دَعْوَةَ ٱلدَّاعِ إِذَا دَعَانِ ۖ فَلْيَسْتَجِيبُوا۟ لِى وَلْيُؤْمِنُوا۟ بِى لَعَلَّهُمْ يَرْشُدُونَ</blockquote></div><div class="reflection"><strong>وقفة للتأمل</strong><p>تأمّل كيف جاء ذكر القرب قبل ذكر الإجابة. وأنت تدعو، أفسح في قلبك مكانًا لهذا المعنى: ربك يعلم حاجتك قبل أن تحسن التعبير عنها. اسأله بصدق، وراجع كيف تستجيب أنت له فيما تعلم من أمره.</p></div></template><template class="message-item"><div class="verse-panel"><p class="small">سورة البقرة · الآية ٢٠١</p><blockquote class="quran message-verse">وَمِنْهُم مَّن يَقُولُ رَبَّنَآ ءَاتِنَا فِى ٱلدُّنْيَا حَسَنَةًۭ وَفِى ٱلْءَاخِرَةِ حَسَنَةًۭ وَقِنَا عَذَابَ ٱلنَّارِ</blockquote></div><div class="reflection"><strong>وقفة للتأمل</strong><p>قد يضيق الدعاء أحيانًا حتى يصبح اسمًا لشيء واحد نريده. وهذه الآية توسّع أفق الطلب إلى حسنة الدنيا وحسنة الآخرة. تأمّل رغبتك الأشدّ: كيف تطلبها وأنت ترجُو معها خير مصيرك وقلبك؟</p></div></template><template class="message-item"><div class="verse-panel"><p class="small">سورة البقرة · الآية ٢٦١</p><blockquote class="quran message-verse">مَّثَلُ ٱلَّذِينَ يُنفِقُونَ أَمْوَٰلَهُمْ فِى سَبِيلِ ٱللَّهِ كَمَثَلِ حَبَّةٍ أَنۢبَتَتْ سَبْعَ سَنَابِلَ فِى كُلِّ سُنۢبُلَةٍۢ مِّا۟ئَةُ حَبَّةٍۢ ۗ وَٱللَّهُ يُضَٰعِفُ لِمَن يَشَآءُ ۗ وَٱللَّهُ وَٰسِعٌ عَلِيمٌ</blockquote></div><div class="reflection"><strong>وقفة للتأمل</strong><p>تبدو الحبّة صغيرة حين توضع في الأرض، ثم يكشف النموّ ما لم تكن العين تراه. تأمّل عطاءك بهذا الرجاء، واترك تقدير مضاعفته لله. أيّ خير تستطيع أن تبذله دون أن تستعجل رؤية أثره؟</p></div></template><template class="message-item"><div class="verse-panel"><p class="small">سورة البقرة · الآية ٢٦٣</p><blockquote class="quran message-verse">۞ قَوْلٌۭ مَّعْرُوفٌۭ وَمَغْفِرَةٌ خَيْرٌۭ مِّن صَدَقَةٍۢ يَتْبَعُهَآ أَذًۭى ۗ وَٱللَّهُ غَنِىٌّ حَلِيمٌۭ</blockquote></div><div class="reflection"><strong>وقفة للتأمل</strong><p>قد تصل الصدقة إلى يد إنسان وتجرح الكلمات قلبه. تأمّل كيف تضع الآية كرامته في صميم العطاء. ما الذي يحتاج إلى تهذيب في نفسك حتى يصل خيرك رفيقًا، ولا يصحبه شعور بالفضل على أحد؟</p></div></template><template class="message-item"><div class="verse-panel"><p class="small">سورة البقرة · الآية ٢٦٩</p><blockquote class="quran message-verse">يُؤْتِى ٱلْحِكْمَةَ مَن يَشَآءُ ۚ وَمَن يُؤْتَ ٱلْحِكْمَةَ فَقَدْ أُوتِىَ خَيْرًۭا كَثِيرًۭا ۗ وَمَا يَذَّكَّرُ إِلَّآ أُو۟لُوا۟ ٱلْأَلْبَٰبِ</blockquote></div><div class="reflection"><strong>وقفة للتأمل</strong><p>ربما عرفت تفاصيل كثيرة عن أمر، وبقيت محتاجًا إلى الحكمة في التعامل معه. اسأل الله بصيرة تعينك على وضع الكلمة والقرار في موضعهما. هل تستمع لتفهم، أم لتجد ما يؤكد رأيك فقط؟</p></div></template><template class="message-item"><div class="verse-panel"><p class="small">سورة البقرة · الآية ٢٧١</p><blockquote class="quran message-verse">إِن تُبْدُوا۟ ٱلصَّدَقَٰتِ فَنِعِمَّا هِىَ ۖ وَإِن تُخْفُوهَا وَتُؤْتُوهَا ٱلْفُقَرَآءَ فَهُوَ خَيْرٌۭ لَّكُمْ ۚ وَيُكَفِّرُ عَنكُم مِّن سَيِّـَٔاتِكُمْ ۗ وَٱللَّهُ بِمَا تَعْمَلُونَ خَبِيرٌۭ</blockquote></div><div class="reflection"><strong>وقفة للتأمل</strong><p>للخير الخفي مساحة تتربّى فيها النيّة بعيدًا عن انتظار المديح. جرّب أن تترك معروفًا لا يعرف صاحبه اسمك، ثم تأمّل قلبك: هل يكفيه أن الله يعلم؟</p></div></template><template class="message-item"><div class="verse-panel"><p class="small">سورة البقرة · الآية ٢٨٠</p><blockquote class="quran message-verse">وَإِن كَانَ ذُو عُسْرَةٍۢ فَنَظِرَةٌ إِلَىٰ مَيْسَرَةٍۢ ۚ وَأَن تَصَدَّقُوا۟ خَيْرٌۭ لَّكُمْ ۖ إِن كُنتُمْ تَعْلَمُونَ</blockquote></div><div class="reflection"><strong>وقفة للتأمل</strong><p>قد يكون انتظارك لحقك متعبًا، ويكون عجز المدين أشدّ عليه. تفتح الآية مساحة للرحمة داخل المطالبة بالحق. تأمّل قدرتك على الإمهال: أيّ ضيق تستطيع أن تخفّفه دون إذلال؟</p></div></template>
<template class="message-item"><div class="verse-panel"><p class="small">سورة الفاتحة · الآية ٦</p><blockquote class="quran message-verse">ٱهۡدِنَا ٱلصِّرَٰطَ ٱلۡمُسۡتَقِيمَ</blockquote></div><div class="reflection"><strong>وقفة للتأمل</strong><p>يتكرر طلب الهداية لأن القلب يحتاجها في خطواته المتجددة. وأنت تقرأ الفاتحة، أحضر القرار الذي تخاف أن تقودك فيه رغبتك وحدها. هل أنت مستعدّ للحق حين يأتي مخالفًا لما تمنّيت؟</p></div></template>
<template class="message-item"><div class="verse-panel"><p class="small">سورة آل عمران · الآية ١٣٤</p><blockquote class="quran message-verse">ٱلَّذِينَ يُنفِقُونَ فِي ٱلسَّرَّآءِ وَٱلضَّرَّآءِ وَٱلۡكَٰظِمِينَ ٱلۡغَيۡظَ وَٱلۡعَافِينَ عَنِ ٱلنَّاسِۗ وَٱللَّهُ يُحِبُّ ٱلۡمُحۡسِنِينَ</blockquote></div><div class="reflection"><strong>وقفة للتأمل</strong><p>في لحظة الغضب، قد يبدو الردّ القاسي استردادًا للقوة. تمهّل وتأمّل القوة التي تحتاجها لتملك نفسك. كيف تحفظ حقك وتترك باب الإحسان مفتوحًا، دون أن تجعل غضبك صاحب القرار؟</p></div></template>
<template class="message-item"><div class="verse-panel"><p class="small">سورة النساء · الآية ٥٨</p><blockquote class="quran message-verse">۞إِنَّ ٱللَّهَ يَأۡمُرُكُمۡ أَن تُؤَدُّواْ ٱلۡأَمَٰنَٰتِ إِلَىٰٓ أَهۡلِهَا وَإِذَا حَكَمۡتُم بَيۡنَ ٱلنَّاسِ أَن تَحۡكُمُواْ بِٱلۡعَدۡلِۚ إِنَّ ٱللَّهَ نِعِمَّا يَعِظُكُم بِهِۦٓۗ إِنَّ ٱللَّهَ كَانَ سَمِيعَۢا بَصِيرٗا</blockquote></div><div class="reflection"><strong>وقفة للتأمل</strong><p>الأمانة تظهر حقيقتها حين تستطيع التفريط فيها ولا يراك أحد. تأمّل ما استودعك الناس من حق أو ثقة. أيّ شيء يحتاج أن تعيده إلى صاحبه لتلقى الله بقلب أخفّ؟</p></div></template>
<template class="message-item"><div class="verse-panel"><p class="small">سورة المائدة · الآية ٨</p><blockquote class="quran message-verse">يَـٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُواْ كُونُواْ قَوَّـٰمِينَ لِلَّهِ شُهَدَآءَ بِٱلۡقِسۡطِۖ وَلَا يَجۡرِمَنَّكُمۡ شَنَـَٔانُ قَوۡمٍ عَلَىٰٓ أَلَّا تَعۡدِلُواْۚ ٱعۡدِلُواْ هُوَ أَقۡرَبُ لِلتَّقۡوَىٰۖ وَٱتَّقُواْ ٱللَّهَۚ إِنَّ ٱللَّهَ خَبِيرُۢ بِمَا تَعۡمَلُونَ</blockquote></div><div class="reflection"><strong>وقفة للتأمل</strong><p>امتحان العدل يشتدّ حين يكون الحق لمن لا تحب. انظر إلى خصومتك من موضع آخر: هل تمنح صاحبها الإنصاف الذي تطلبه لنفسك؟ اجعل تقوى الله حاضرة حتى في وصفك لمن خالفك.</p></div></template>
<template class="message-item"><div class="verse-panel"><p class="small">سورة الأنعام · الآية ١٤١</p><blockquote class="quran message-verse">۞وَهُوَ ٱلَّذِيٓ أَنشَأَ جَنَّـٰتٖ مَّعۡرُوشَٰتٖ وَغَيۡرَ مَعۡرُوشَٰتٖ وَٱلنَّخۡلَ وَٱلزَّرۡعَ مُخۡتَلِفًا أُكُلُهُۥ وَٱلزَّيۡتُونَ وَٱلرُّمَّانَ مُتَشَٰبِهٗا وَغَيۡرَ مُتَشَٰبِهٖۚ كُلُواْ مِن ثَمَرِهِۦٓ إِذَآ أَثۡمَرَ وَءَاتُواْ حَقَّهُۥ يَوۡمَ حَصَادِهِۦۖ وَلَا تُسۡرِفُوٓاْۚ إِنَّهُۥ لَا يُحِبُّ ٱلۡمُسۡرِفِينَ</blockquote></div><div class="reflection"><strong>وقفة للتأمل</strong><p>تأمّل الرزق بين نعمة الانتفاع به وحقّ غيرك فيه. حين يفيض ما عندك، هل يتسع معه شعورك بالمسؤولية؟ دع الشكر يظهر في اعتدالك، وفي نصيب تحفظه لمن يحتاج.</p></div></template>
<template class="message-item"><div class="verse-panel"><p class="small">سورة الأعراف · الآية ٥٥</p><blockquote class="quran message-verse">ٱدۡعُواْ رَبَّكُمۡ تَضَرُّعٗا وَخُفۡيَةًۚ إِنَّهُۥ لَا يُحِبُّ ٱلۡمُعۡتَدِينَ</blockquote></div><div class="reflection"><strong>وقفة للتأمل</strong><p>في الدعاء الخفي تسقط الحاجة إلى ترتيب صورتك أمام أحد. اجلس مع حاجتك كما هي، وأقبل على الله بتضرّع. أيّ كلمة صادقة بقيت تؤجل قولها في دعائك؟</p></div></template>
<template class="message-item"><div class="verse-panel"><p class="small">سورة الأنفال · الآية ٤٦</p><blockquote class="quran message-verse">وَأَطِيعُواْ ٱللَّهَ وَرَسُولَهُۥ وَلَا تَنَٰزَعُواْ فَتَفۡشَلُواْ وَتَذۡهَبَ رِيحُكُمۡۖ وَٱصۡبِرُوٓاْۚ إِنَّ ٱللَّهَ مَعَ ٱلصَّـٰبِرِينَ</blockquote></div><div class="reflection"><strong>وقفة للتأمل</strong><p>قد يستهلك النزاع من قلوبنا ما كان ينبغي أن نبذله في العمل. تأمّل نصيبك من الخلاف: أين تستطيع أن تخفّف حدّته دون التفريط في الحق؟ للصبر هنا أثر في حفظ ما يجمعكم.</p></div></template>
<template class="message-item"><div class="verse-panel"><p class="small">سورة التوبة · الآية ١١٩</p><blockquote class="quran message-verse">يَـٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُواْ ٱتَّقُواْ ٱللَّهَ وَكُونُواْ مَعَ ٱلصَّـٰدِقِينَ</blockquote></div><div class="reflection"><strong>وقفة للتأمل</strong><p>الصدق يبدأ أحيانًا باعتراف لا يسمعه غيرك: هذا ما أخافه، وهذا ما أخطأت فيه. تأمّل الصحبة التي تجعل الصدق أيسر عليك. هل تقرّبك من حقيقتك أم تعلّمك إخفاءها؟</p></div></template>
<template class="message-item"><div class="verse-panel"><p class="small">سورة يونس · الآية ٥٧</p><blockquote class="quran message-verse">يَـٰٓأَيُّهَا ٱلنَّاسُ قَدۡ جَآءَتۡكُم مَّوۡعِظَةٞ مِّن رَّبِّكُمۡ وَشِفَآءٞ لِّمَا فِي ٱلصُّدُورِ وَهُدٗى وَرَحۡمَةٞ لِّلۡمُؤۡمِنِينَ</blockquote></div><div class="reflection"><strong>وقفة للتأمل</strong><p>اقترب من القرآن وأنت تسمح لمعناه أن يمسّ ما في صدرك. قد تكشف لك آية موضع خوف أو حسد لم تنتبه إليه. ما الذي يحتاج في داخلك إلى هداية، وراء حاجتك إلى المواساة؟</p></div></template>
<template class="message-item"><div class="verse-panel"><p class="small">سورة هود · الآية ١١٥</p><blockquote class="quran message-verse">وَٱصۡبِرۡ فَإِنَّ ٱللَّهَ لَا يُضِيعُ أَجۡرَ ٱلۡمُحۡسِنِينَ</blockquote></div><div class="reflection"><strong>وقفة للتأمل</strong><p>بعض الإحسان يمرّ دون شكر، وقد يؤلمك ألّا يراه أحد. تذكّر أن غياب التقدير البشري لا يمحو العمل عند الله. أيّ معروف تستطيع أن تحفظ نيّته من مرارة الانتظار؟</p></div></template>
<template class="message-item"><div class="verse-panel"><p class="small">سورة يوسف · الآية ٨٦</p><blockquote class="quran message-verse">قَالَ إِنَّمَآ أَشۡكُواْ بَثِّي وَحُزۡنِيٓ إِلَى ٱللَّهِ وَأَعۡلَمُ مِنَ ٱللَّهِ مَا لَا تَعۡلَمُونَ</blockquote></div><div class="reflection"><strong>وقفة للتأمل</strong><p>يبثّ يعقوب حزنه إلى الله؛ وفي ذلك متّسع للتأمّل في صدق الشكوى. لا تحتاج أن تنكر وجعك كي تتوجّه إلى ربك. سمِّ ما يؤلمك، ودع الدعاء يحمل ما تعجز الكلمات أمام الناس عن حمله.</p></div></template>
<template class="message-item"><div class="verse-panel"><p class="small">سورة الرعد · الآية ٢٨</p><blockquote class="quran message-verse">ٱلَّذِينَ ءَامَنُواْ وَتَطۡمَئِنُّ قُلُوبُهُم بِذِكۡرِ ٱللَّهِۗ أَلَا بِذِكۡرِ ٱللَّهِ تَطۡمَئِنُّ ٱلۡقُلُوبُ</blockquote></div><div class="reflection"><strong>وقفة للتأمل</strong><p>أمهل قلبك عند الذكر؛ فقد يتحرك اللسان بينما يبقى الفكر مشغولًا بكل احتمال. تأمّل الاسم الذي تنادي به الله ومعناه. إلى أين يعود قلبك كلما أخافته تقلّبات ما حوله؟</p></div></template>
<template class="message-item"><div class="verse-panel"><p class="small">سورة ابراهيم · الآية ٤٠</p><blockquote class="quran message-verse">رَبِّ ٱجۡعَلۡنِي مُقِيمَ ٱلصَّلَوٰةِ وَمِن ذُرِّيَّتِيۚ رَبَّنَا وَتَقَبَّلۡ دُعَآءِ</blockquote></div><div class="reflection"><strong>وقفة للتأمل</strong><p>في دعاء إبراهيم يمتدّ الاهتمام بالصلاة إلى الذريّة. تأمّل ما تتمنى أن يبقى في أهل بيتك بعدك. أيّ صلة بالله تبنيها في نفسك اليوم، وترجو أن يروا أثرها في حياتك؟</p></div></template>
<template class="message-item"><div class="verse-panel"><p class="small">سورة الحجر · الآية ٩٨</p><blockquote class="quran message-verse">فَسَبِّحۡ بِحَمۡدِ رَبِّكَ وَكُن مِّنَ ٱلسَّـٰجِدِينَ</blockquote></div><div class="reflection"><strong>وقفة للتأمل</strong><p>حين يضيق الصدر، قد تستحوذ عليه كلمات الناس حتى لا يسمع غيرها. أفسح للتسبيح والسجود مكانًا وسط هذا الضجيج. ما الذي يتغيّر في نظرتك حين تستحضر عظمة الله وأنت تحمل همّك؟</p></div></template>
<template class="message-item"><div class="verse-panel"><p class="small">سورة النحل · الآية ٩٠</p><blockquote class="quran message-verse">۞إِنَّ ٱللَّهَ يَأۡمُرُ بِٱلۡعَدۡلِ وَٱلۡإِحۡسَٰنِ وَإِيتَآيِٕ ذِي ٱلۡقُرۡبَىٰ وَيَنۡهَىٰ عَنِ ٱلۡفَحۡشَآءِ وَٱلۡمُنكَرِ وَٱلۡبَغۡيِۚ يَعِظُكُمۡ لَعَلَّكُمۡ تَذَكَّرُونَ</blockquote></div><div class="reflection"><strong>وقفة للتأمل</strong><p>تأمّل اتساع العبادة في هذه الآية: عدل وإحسان وصلة، وابتعاد عن الأذى. أين يظهر قربك من الله في تعامل لا يراه الناس عبادة؟ اختر علاقة تحتاج منك عدلًا أصدق أو رحمة أوسع.</p></div></template>
<template class="message-item"><div class="verse-panel"><p class="small">سورة الإسراء · الآية ٢٤</p><blockquote class="quran message-verse">وَٱخۡفِضۡ لَهُمَا جَنَاحَ ٱلذُّلِّ مِنَ ٱلرَّحۡمَةِ وَقُل رَّبِّ ٱرۡحَمۡهُمَا كَمَا رَبَّيَانِي صَغِيرٗا</blockquote></div><div class="reflection"><strong>وقفة للتأمل</strong><p>يعود الدعاء إلى زمن كنت فيه صغيرًا تحتاج إلى الرعاية. تأمّل ما تستطيع أن تقدّمه اليوم من رحمة وبرّ، ولو كان دعاءً صادقًا. كيف يبقى قلبك رفيقًا وهو يحفظ حدوده وحقوقه؟</p></div></template>
<template class="message-item"><div class="verse-panel"><p class="small">سورة الكهف · الآية ١٠</p><blockquote class="quran message-verse">إِذۡ أَوَى ٱلۡفِتۡيَةُ إِلَى ٱلۡكَهۡفِ فَقَالُواْ رَبَّنَآ ءَاتِنَا مِن لَّدُنكَ رَحۡمَةٗ وَهَيِّئۡ لَنَا مِنۡ أَمۡرِنَا رَشَدٗا</blockquote></div><div class="reflection"><strong>وقفة للتأمل</strong><p>طلب الفتية الرحمة والرشد وهم في أمر صعب. تأمّل حاجتك إلى هذين المعنيين حين تحتار: رحمة تحمل ضعفك، ورشد يوجّه خطوتك. هل تطلب فتح الطريق فقط، أم حسن السير فيه أيضًا؟</p></div></template>
<template class="message-item"><div class="verse-panel"><p class="small">سورة مريم · الآية ٣٢</p><blockquote class="quran message-verse">وَبَرَّۢا بِوَٰلِدَتِي وَلَمۡ يَجۡعَلۡنِي جَبَّارٗا شَقِيّٗا</blockquote></div><div class="reflection"><strong>وقفة للتأمل</strong><p>تأمّل اقتران البرّ بالبعد عن الجبروت في كلام عيسى. قد يظهر التواضع في إصغاء أو رفق لا يلفت الأنظار. أين تستطيع أن تليّن أسلوبك مع أمك دون أن تجعل المعروف انتظارًا للمقابل؟</p></div></template>
<template class="message-item"><div class="verse-panel"><p class="small">سورة طه · الآية ١١٤</p><blockquote class="quran message-verse">فَتَعَٰلَى ٱللَّهُ ٱلۡمَلِكُ ٱلۡحَقُّۗ وَلَا تَعۡجَلۡ بِٱلۡقُرۡءَانِ مِن قَبۡلِ أَن يُقۡضَىٰٓ إِلَيۡكَ وَحۡيُهُۥۖ وَقُل رَّبِّ زِدۡنِي عِلۡمٗا</blockquote></div><div class="reflection"><strong>وقفة للتأمل</strong><p>كلما اتسع العلم، انكشف للإنسان شيء من حدود معرفته. اجعل طلب الزيادة دعاءً يرافق تعلّمك، وتأمّل أثر ما تعرفه في خُلُقك. هل جعلك العلم أكثر إنصافًا واستعدادًا للمراجعة؟</p></div></template>
<template class="message-item"><div class="verse-panel"><p class="small">سورة الأنبياء · الآية ٨٣</p><blockquote class="quran message-verse">۞وَأَيُّوبَ إِذۡ نَادَىٰ رَبَّهُۥٓ أَنِّي مَسَّنِيَ ٱلضُّرُّ وَأَنتَ أَرۡحَمُ ٱلرَّـٰحِمِينَ</blockquote></div><div class="reflection"><strong>وقفة للتأمل</strong><p>في دعاء أيوب يجتمع الاعتراف بالضرّ واستحضار الرحمة. تأمّل هذا الصدق: تستطيع أن تقول إنك تتألم، وأن ترجُو رحمة الله في اللحظة نفسها. ما الذي تحتاج أن تبوح به دون تكلّف القوة؟</p></div></template>
<template class="message-item"><div class="verse-panel"><p class="small">سورة الحج · الآية ٧٧</p><blockquote class="quran message-verse">يَـٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُواْ ٱرۡكَعُواْ وَٱسۡجُدُواْۤ وَٱعۡبُدُواْ رَبَّكُمۡ وَٱفۡعَلُواْ ٱلۡخَيۡرَ لَعَلَّكُمۡ تُفۡلِحُونَ۩</blockquote></div><div class="reflection"><strong>وقفة للتأمل</strong><p>تمتدّ الآية من الركوع والسجود إلى فعل الخير. تأمّل ما تحمله معك حين تقوم من عبادتك: هل يجد الناس في معاملتك شيئًا من أثرها؟ أين يمكن أن يتحوّل خشوعك إلى إحسان؟</p></div></template>
<template class="message-item"><div class="verse-panel"><p class="small">سورة المؤمنون · الآية ١١٨</p><blockquote class="quran message-verse">وَقُل رَّبِّ ٱغۡفِرۡ وَٱرۡحَمۡ وَأَنتَ خَيۡرُ ٱلرَّـٰحِمِينَ</blockquote></div><div class="reflection"><strong>وقفة للتأمل</strong><p>تحتاج إلى المغفرة فيما مضى، وإلى الرحمة في الطريق الذي ما زلت تمشيه. أبطئ في هذا الدعاء، وأحضر تقصيرك ورجاءك معًا. ما الذي يدعوك الرجاء إلى إصلاحه الآن؟</p></div></template>
<template class="message-item"><div class="verse-panel"><p class="small">سورة النور · الآية ٢٢</p><blockquote class="quran message-verse">وَلَا يَأۡتَلِ أُوْلُواْ ٱلۡفَضۡلِ مِنكُمۡ وَٱلسَّعَةِ أَن يُؤۡتُوٓاْ أُوْلِي ٱلۡقُرۡبَىٰ وَٱلۡمَسَٰكِينَ وَٱلۡمُهَٰجِرِينَ فِي سَبِيلِ ٱللَّهِۖ وَلۡيَعۡفُواْ وَلۡيَصۡفَحُوٓاْۗ أَلَا تُحِبُّونَ أَن يَغۡفِرَ ٱللَّهُ لَكُمۡۚ وَٱللَّهُ غَفُورٞ رَّحِيمٌ</blockquote></div><div class="reflection"><strong>وقفة للتأمل</strong><p>تسأل الآية قلبك عن محبّته لمغفرة الله. دع السؤال يصل إلى موضع جرحك برفق، دون استعجال مشاعرك. كيف تفتح مساحة للعفو مع حفظ حقك وحدودك من الأذى؟</p></div></template>
<template class="message-item"><div class="verse-panel"><p class="small">سورة الفرقان · الآية ٦٣</p><blockquote class="quran message-verse">وَعِبَادُ ٱلرَّحۡمَٰنِ ٱلَّذِينَ يَمۡشُونَ عَلَى ٱلۡأَرۡضِ هَوۡنٗا وَإِذَا خَاطَبَهُمُ ٱلۡجَٰهِلُونَ قَالُواْ سَلَٰمٗا</blockquote></div><div class="reflection"><strong>وقفة للتأمل</strong><p>تأمّل هدوءًا ينشأ من اختيار واعٍ للكلمة، لا من العجز عن الرد. قد تستطيع أن تنهي جدالًا وتحفظ كرامتك دون أن تحمل قسوته إلى داخلك. أيّ خصومة لا تستحق أن تسلّمها صفاء يومك؟</p></div></template>
<template class="message-item"><div class="verse-panel"><p class="small">سورة الشعراء · الآية ٨٣</p><blockquote class="quran message-verse">رَبِّ هَبۡ لِي حُكۡمٗا وَأَلۡحِقۡنِي بِٱلصَّـٰلِحِينَ</blockquote></div><div class="reflection"><strong>وقفة للتأمل</strong><p>في دعاء إبراهيم طلب للحكمة والصحبة الصالحة. تأمّل الطريق الذي تصنعه اختياراتك ومن تمشي معهم. مَن يعينك على رؤية عيبك برحمة، وعلى الاقتراب من الصلاح بصدق؟</p></div></template>
<template class="message-item"><div class="verse-panel"><p class="small">سورة النمل · الآية ١٩</p><blockquote class="quran message-verse">فَتَبَسَّمَ ضَاحِكٗا مِّن قَوۡلِهَا وَقَالَ رَبِّ أَوۡزِعۡنِيٓ أَنۡ أَشۡكُرَ نِعۡمَتَكَ ٱلَّتِيٓ أَنۡعَمۡتَ عَلَيَّ وَعَلَىٰ وَٰلِدَيَّ وَأَنۡ أَعۡمَلَ صَٰلِحٗا تَرۡضَىٰهُ وَأَدۡخِلۡنِي بِرَحۡمَتِكَ فِي عِبَادِكَ ٱلصَّـٰلِحِينَ</blockquote></div><div class="reflection"><strong>وقفة للتأمل</strong><p>قد نعرف النعمة ولا نعرف كيف نشكرها حقًا. تأمّل دعاء سليمان في طلب العون على الشكر والعمل الصالح. أيّ نعمة في حياتك تحتاج أن تنتقل من ذكرها باللسان إلى حسن استعمالها؟</p></div></template>
<template class="message-item"><div class="verse-panel"><p class="small">سورة القصص · الآية ٢٤</p><blockquote class="quran message-verse">فَسَقَىٰ لَهُمَا ثُمَّ تَوَلَّىٰٓ إِلَى ٱلظِّلِّ فَقَالَ رَبِّ إِنِّي لِمَآ أَنزَلۡتَ إِلَيَّ مِنۡ خَيۡرٖ فَقِيرٞ</blockquote></div><div class="reflection"><strong>وقفة للتأمل</strong><p>بعد سعي موسى جاء اعترافه بفقره إلى خير الله. تأمّل حاجتك دون خجل، وقدرتك دون اغترار. ما الذي تستطيع أن تبذله اليوم، ثم ترفعه إلى الله بدعاء صادق؟</p></div></template>
<template class="message-item"><div class="verse-panel"><p class="small">سورة العنكبوت · الآية ٦٩</p><blockquote class="quran message-verse">وَٱلَّذِينَ جَٰهَدُواْ فِينَا لَنَهۡدِيَنَّهُمۡ سُبُلَنَاۚ وَإِنَّ ٱللَّهَ لَمَعَ ٱلۡمُحۡسِنِينَ</blockquote></div><div class="reflection"><strong>وقفة للتأمل</strong><p>قد يبدأ الاقتراب من الله بمجاهدة لا يراها غيره: ترك عادة أو مقاومة كبرياء أو عودة بعد فتور. أين يتعثر صدقك بين المعرفة والعمل؟ خذ الخطوة الممكنة وأنت ترجُو هدايته.</p></div></template>
<template class="message-item"><div class="verse-panel"><p class="small">سورة الروم · الآية ٢١</p><blockquote class="quran message-verse">وَمِنۡ ءَايَٰتِهِۦٓ أَنۡ خَلَقَ لَكُم مِّنۡ أَنفُسِكُمۡ أَزۡوَٰجٗا لِّتَسۡكُنُوٓاْ إِلَيۡهَا وَجَعَلَ بَيۡنَكُم مَّوَدَّةٗ وَرَحۡمَةًۚ إِنَّ فِي ذَٰلِكَ لَأٓيَٰتٖ لِّقَوۡمٖ يَتَفَكَّرُونَ</blockquote></div><div class="reflection"><strong>وقفة للتأمل</strong><p>تأمّل المودّة والرحمة بوصفهما حضورًا في تفاصيل العيش: إصغاءً، وأمانًا، ورفقًا عند الاختلاف. ما الذي تضيفه طريقتك في الكلام إلى البيت؟ وأيّ سلوك يحتاج إصلاحًا ليصبح أقرب إلى السكينة؟</p></div></template>
<template class="message-item"><div class="verse-panel"><p class="small">سورة لقمان · الآية ١٩</p><blockquote class="quran message-verse">وَٱقۡصِدۡ فِي مَشۡيِكَ وَٱغۡضُضۡ مِن صَوۡتِكَۚ إِنَّ أَنكَرَ ٱلۡأَصۡوَٰتِ لَصَوۡتُ ٱلۡحَمِيرِ</blockquote></div><div class="reflection"><strong>وقفة للتأمل</strong><p>قد تحمل نبرة الصوت ما لا تقصده الكلمات. تأمّل أثر حضورك على من أمامك، خصوصًا حين تملك سلطة أو تكون غاضبًا. كيف تقول الحق بصوت يترك للآخر مساحة وكرامة؟</p></div></template>
<template class="message-item"><div class="verse-panel"><p class="small">سورة السجدة · الآية ١٧</p><blockquote class="quran message-verse">فَلَا تَعۡلَمُ نَفۡسٞ مَّآ أُخۡفِيَ لَهُم مِّن قُرَّةِ أَعۡيُنٖ جَزَآءَۢ بِمَا كَانُواْ يَعۡمَلُونَ</blockquote></div><div class="reflection"><strong>وقفة للتأمل</strong><p>تترك الآية للرجاء أفقًا أوسع مما تستطيع تخيّله. تأمّل عملًا صالحًا تؤدّيه بعيدًا عن الأنظار، وما ترجوه عند الله. كيف يتغير سعيك حين لا تحصر قيمة الخير في ثمرته العاجلة؟</p></div></template>
<template class="message-item"><div class="verse-panel"><p class="small">سورة الأحزاب · الآية ٧٠</p><blockquote class="quran message-verse">يَـٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُواْ ٱتَّقُواْ ٱللَّهَ وَقُولُواْ قَوۡلٗا سَدِيدٗا</blockquote></div><div class="reflection"><strong>وقفة للتأمل</strong><p>الكلمة السديدة تحتاج صدقًا وتقديرًا لأثرها. قبل أن تتكلم، أنصت إلى النيّة التي تدفعك: أترجو الإصلاح أم الانتصار لنفسك؟ امنح كلامك وقتًا ليخرج أقرب إلى الحق والرحمة.</p></div></template>
<template class="message-item"><div class="verse-panel"><p class="small">سورة سبإ · الآية ١٣</p><blockquote class="quran message-verse">يَعۡمَلُونَ لَهُۥ مَا يَشَآءُ مِن مَّحَٰرِيبَ وَتَمَٰثِيلَ وَجِفَانٖ كَٱلۡجَوَابِ وَقُدُورٖ رَّاسِيَٰتٍۚ ٱعۡمَلُوٓاْ ءَالَ دَاوُۥدَ شُكۡرٗاۚ وَقَلِيلٞ مِّنۡ عِبَادِيَ ٱلشَّكُورُ</blockquote></div><div class="reflection"><strong>وقفة للتأمل</strong><p>تأمّل الشكر حين يصبح عملًا. النعمة التي في يدك يمكن أن تعين بها، والعلم الذي عندك يمكن أن تنفع به. أيّ أثر عملي يشهد أنك انتبهت إلى فضل الله عليك؟</p></div></template>
<template class="message-item"><div class="verse-panel"><p class="small">سورة فاطر · الآية ٣</p><blockquote class="quran message-verse">يَـٰٓأَيُّهَا ٱلنَّاسُ ٱذۡكُرُواْ نِعۡمَتَ ٱللَّهِ عَلَيۡكُمۡۚ هَلۡ مِنۡ خَٰلِقٍ غَيۡرُ ٱللَّهِ يَرۡزُقُكُم مِّنَ ٱلسَّمَآءِ وَٱلۡأَرۡضِۚ لَآ إِلَٰهَ إِلَّا هُوَۖ فَأَنَّىٰ تُؤۡفَكُونَ</blockquote></div><div class="reflection"><strong>وقفة للتأمل</strong><p>قد تألف النعمة حتى تختفي من انتباهك، وهي لم تغب عن حياتك. تأمّل رزقًا يصلك كل يوم، ومصدره الذي تتجاوز إليه الأسباب. ما الذي يعود إلى قلبك حين تراه عطية تستحق الشكر؟</p></div></template>
<template class="message-item"><div class="verse-panel"><p class="small">سورة يس · الآية ٣٣</p><blockquote class="quran message-verse">وَءَايَةٞ لَّهُمُ ٱلۡأَرۡضُ ٱلۡمَيۡتَةُ أَحۡيَيۡنَٰهَا وَأَخۡرَجۡنَا مِنۡهَا حَبّٗا فَمِنۡهُ يَأۡكُلُونَ</blockquote></div><div class="reflection"><strong>وقفة للتأمل</strong><p>الأرض التي تبدو ساكنة يخرج منها ما تقوم به حياتك. تأمّل طعامك من هذه البداية، قبل أن يصير شيئًا مألوفًا على المائدة. كم من النعم تمرّ بعينيك دون أن توقظ فيهما الدهشة؟</p></div></template>
<template class="message-item"><div class="verse-panel"><p class="small">سورة الصافات · الآية ١٠٠</p><blockquote class="quran message-verse">رَبِّ هَبۡ لِي مِنَ ٱلصَّـٰلِحِينَ</blockquote></div><div class="reflection"><strong>وقفة للتأمل</strong><p>في طلب الذريّة يسبق وصف الصلاح كثيرًا مما يشغل الناس من الصفات. تأمّل ما ترجوه لمن تحب: أيّ قلب وأيّ خُلُق؟ وما الذي تستطيع أن تغرسه بالرعاية والقدوة مع الدعاء؟</p></div></template>
<template class="message-item"><div class="verse-panel"><p class="small">سورة ص · الآية ٢٩</p><blockquote class="quran message-verse">كِتَٰبٌ أَنزَلۡنَٰهُ إِلَيۡكَ مُبَٰرَكٞ لِّيَدَّبَّرُوٓاْ ءَايَٰتِهِۦ وَلِيَتَذَكَّرَ أُوْلُواْ ٱلۡأَلۡبَٰبِ</blockquote></div><div class="reflection"><strong>وقفة للتأمل</strong><p>التدبّر يحتاج أن تسمح للآية بتغيير سؤال في داخلك. توقّف عند ما استوقفك منها، ثم انظر إلى حياتك في ضوئه. أيّ معنى تعرفه منذ زمن ولم تمنحه مكانًا في عملك؟</p></div></template>
<template class="message-item"><div class="verse-panel"><p class="small">سورة الزمر · الآية ٥٣</p><blockquote class="quran message-verse">۞قُلۡ يَٰعِبَادِيَ ٱلَّذِينَ أَسۡرَفُواْ عَلَىٰٓ أَنفُسِهِمۡ لَا تَقۡنَطُواْ مِن رَّحۡمَةِ ٱللَّهِۚ إِنَّ ٱللَّهَ يَغۡفِرُ ٱلذُّنُوبَ جَمِيعًاۚ إِنَّهُۥ هُوَ ٱلۡغَفُورُ ٱلرَّحِيمُ</blockquote></div><div class="reflection"><strong>وقفة للتأمل</strong><p>قد يجعل الخجل من الخطأ الرجوع أثقل، فتحتاج أن تتأمّل سعة الرحمة بصدق. افتح باب التوبة وأنت تعترف بما يحتاج إصلاحًا. أيّ خطوة تستطيع أن تبدأها دون انتظار أن تصبح كاملًا؟</p></div></template>
<template class="message-item"><div class="verse-panel"><p class="small">سورة غافر · الآية ٦٠</p><blockquote class="quran message-verse">وَقَالَ رَبُّكُمُ ٱدۡعُونِيٓ أَسۡتَجِبۡ لَكُمۡۚ إِنَّ ٱلَّذِينَ يَسۡتَكۡبِرُونَ عَنۡ عِبَادَتِي سَيَدۡخُلُونَ جَهَنَّمَ دَاخِرِينَ</blockquote></div><div class="reflection"><strong>وقفة للتأمل</strong><p>تأمّل الدعاء وأنت تقف محتاجًا بين يدي ربك. ماذا يبقى من تكلّف الاكتفاء حين تصارحه بما تحمل؟ ارفع طلبك، وافتح قلبك للعبادة التي يستقيم بها طريقك إليه.</p></div></template>
<template class="message-item"><div class="verse-panel"><p class="small">سورة فصلت · الآية ٣٤</p><blockquote class="quran message-verse">وَلَا تَسۡتَوِي ٱلۡحَسَنَةُ وَلَا ٱلسَّيِّئَةُۚ ٱدۡفَعۡ بِٱلَّتِي هِيَ أَحۡسَنُ فَإِذَا ٱلَّذِي بَيۡنَكَ وَبَيۡنَهُۥ عَدَٰوَةٞ كَأَنَّهُۥ وَلِيٌّ حَمِيمٞ</blockquote></div><div class="reflection"><strong>وقفة للتأمل</strong><p>في قدرتك على ردّ الإساءة مساحة للاختيار. تأمّل جوابًا يصلح ما يمكن إصلاحه ويحفظ كرامتك. هل تستطيع أن تمنع أذى الآخرين من أن يصبح صفة فيك، مع اتخاذ ما يحميك؟</p></div></template>
<template class="message-item"><div class="verse-panel"><p class="small">سورة الشورى · الآية ٤٣</p><blockquote class="quran message-verse">وَلَمَن صَبَرَ وَغَفَرَ إِنَّ ذَٰلِكَ لَمِنۡ عَزۡمِ ٱلۡأُمُورِ</blockquote></div><div class="reflection"><strong>وقفة للتأمل</strong><p>الصبر والغفران قد يحتاجان مجاهدة طويلة، ولا ينضجان بأمر سريع للمشاعر. تأمّل ما تستطيع فعله الآن لتخرج من أسر المرارة. كيف تمضي إلى سلامك دون إنكار ما وقع أو تضييع حقك؟</p></div></template>
<template class="message-item"><div class="verse-panel"><p class="small">سورة الزخرف · الآية ١٣</p><blockquote class="quran message-verse">لِتَسۡتَوُۥاْ عَلَىٰ ظُهُورِهِۦ ثُمَّ تَذۡكُرُواْ نِعۡمَةَ رَبِّكُمۡ إِذَا ٱسۡتَوَيۡتُمۡ عَلَيۡهِ وَتَقُولُواْ سُبۡحَٰنَ ٱلَّذِي سَخَّرَ لَنَا هَٰذَا وَمَا كُنَّا لَهُۥ مُقۡرِنِينَ</blockquote></div><div class="reflection"><strong>وقفة للتأمل</strong><p>في الأشياء التي تحملك كل يوم نعمة يسهل أن تختبئ خلف الاعتياد. تأمّل ما سُخّر لك، وما تعجز عنه وحدك. دع شعورك بالقدرة يصحبه تواضع وشكر.</p></div></template>
<template class="message-item"><div class="verse-panel"><p class="small">سورة الدخان · الآية ٣٨</p><blockquote class="quran message-verse">وَمَا خَلَقۡنَا ٱلسَّمَٰوَٰتِ وَٱلۡأَرۡضَ وَمَا بَيۡنَهُمَا لَٰعِبِينَ</blockquote></div><div class="reflection"><strong>وقفة للتأمل</strong><p>تأمّل جديّة وجودك وأنت تنظر إلى السماء والأرض. كيف ينعكس هذا المعنى على وقت تمنحه لما لا يبقى؟ أيّ عمل ترغب أن يكون شاهدًا على حسن حضورك في الحياة؟</p></div></template>
<template class="message-item"><div class="verse-panel"><p class="small">سورة الجاثية · الآية ١٣</p><blockquote class="quran message-verse">وَسَخَّرَ لَكُم مَّا فِي ٱلسَّمَٰوَٰتِ وَمَا فِي ٱلۡأَرۡضِ جَمِيعٗا مِّنۡهُۚ إِنَّ فِي ذَٰلِكَ لَأٓيَٰتٖ لِّقَوۡمٖ يَتَفَكَّرُونَ</blockquote></div><div class="reflection"><strong>وقفة للتأمل</strong><p>حولك منافع كثيرة في خلق الله قد تمرّ بها على عجل. أطل النظر إلى واحدة منها، واسأل كيف تستعملها بأمانة. ما الذي يوقظه التفكّر فيك من شكر ومسؤولية؟</p></div></template>
<template class="message-item"><div class="verse-panel"><p class="small">سورة الأحقاف · الآية ١٥</p><blockquote class="quran message-verse">وَوَصَّيۡنَا ٱلۡإِنسَٰنَ بِوَٰلِدَيۡهِ إِحۡسَٰنًاۖ حَمَلَتۡهُ أُمُّهُۥ كُرۡهٗا وَوَضَعَتۡهُ كُرۡهٗاۖ وَحَمۡلُهُۥ وَفِصَٰلُهُۥ ثَلَٰثُونَ شَهۡرًاۚ حَتَّىٰٓ إِذَا بَلَغَ أَشُدَّهُۥ وَبَلَغَ أَرۡبَعِينَ سَنَةٗ قَالَ رَبِّ أَوۡزِعۡنِيٓ أَنۡ أَشۡكُرَ نِعۡمَتَكَ ٱلَّتِيٓ أَنۡعَمۡتَ عَلَيَّ وَعَلَىٰ وَٰلِدَيَّ وَأَنۡ أَعۡمَلَ صَٰلِحٗا تَرۡضَىٰهُ وَأَصۡلِحۡ لِي فِي ذُرِّيَّتِيٓۖ إِنِّي تُبۡتُ إِلَيۡكَ وَإِنِّي مِنَ ٱلۡمُسۡلِمِينَ</blockquote></div><div class="reflection"><strong>وقفة للتأمل</strong><p>في هذا الدعاء امتداد من الوالدين إلى الذريّة، ومن الشكر إلى العمل الصالح. تأمّل حياتك داخل هذا الامتداد. ما الخير الذي وصل إليك، وكيف تختار أن تكمل أثره؟</p></div></template>
<template class="message-item"><div class="verse-panel"><p class="small">سورة محمد · الآية ٢٤</p><blockquote class="quran message-verse">أَفَلَا يَتَدَبَّرُونَ ٱلۡقُرۡءَانَ أَمۡ عَلَىٰ قُلُوبٍ أَقۡفَالُهَآ</blockquote></div><div class="reflection"><strong>وقفة للتأمل</strong><p>قد نقرأ الآية ونستعجل ما بعدها قبل أن نسمح لها بسؤالنا. تأمّل ما يحول بينك وبين الإصغاء: عادة أم انشغال أم رغبة في تجنّب معنى صعب؟ اترك لقلبك فرصة أن يتعلّم.</p></div></template>
<template class="message-item"><div class="verse-panel"><p class="small">سورة الفتح · الآية ٤</p><blockquote class="quran message-verse">هُوَ ٱلَّذِيٓ أَنزَلَ ٱلسَّكِينَةَ فِي قُلُوبِ ٱلۡمُؤۡمِنِينَ لِيَزۡدَادُوٓاْ إِيمَٰنٗا مَّعَ إِيمَٰنِهِمۡۗ وَلِلَّهِ جُنُودُ ٱلسَّمَٰوَٰتِ وَٱلۡأَرۡضِۚ وَكَانَ ٱللَّهُ عَلِيمًا حَكِيمٗا</blockquote></div><div class="reflection"><strong>وقفة للتأمل</strong><p>تأمّل السكينة بوصفها نعمة تطلبها وأنت وسط ما يقلقك. اسأل الله قلبًا أثبت، وخذ ما تستطيع من أسباب الطمأنينة. أيّ خوف تحتاج أن تضعه في دعائك بدل الدوران حوله وحدك؟</p></div></template>
<template class="message-item"><div class="verse-panel"><p class="small">سورة الحجرات · الآية ١٢</p><blockquote class="quran message-verse">يَـٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُواْ ٱجۡتَنِبُواْ كَثِيرٗا مِّنَ ٱلظَّنِّ إِنَّ بَعۡضَ ٱلظَّنِّ إِثۡمٞۖ وَلَا تَجَسَّسُواْ وَلَا يَغۡتَب بَّعۡضُكُم بَعۡضًاۚ أَيُحِبُّ أَحَدُكُمۡ أَن يَأۡكُلَ لَحۡمَ أَخِيهِ مَيۡتٗا فَكَرِهۡتُمُوهُۚ وَٱتَّقُواْ ٱللَّهَۚ إِنَّ ٱللَّهَ تَوَّابٞ رَّحِيمٞ</blockquote></div><div class="reflection"><strong>وقفة للتأمل</strong><p>للغائب كرامة لا تسقط حين يغيب صوته عن المجلس. تأمّل الظنّ قبل أن يتحول إلى قصة ترويها. ما الذي تعرفه حقًا، وما الذي أضافه غضبك أو فضولك؟</p></div></template>
<template class="message-item"><div class="verse-panel"><p class="small">سورة ق · الآية ١٨</p><blockquote class="quran message-verse">مَّا يَلۡفِظُ مِن قَوۡلٍ إِلَّا لَدَيۡهِ رَقِيبٌ عَتِيدٞ</blockquote></div><div class="reflection"><strong>وقفة للتأمل</strong><p>تخيّل حديث يومك وأنت تعود إليه كلمة كلمة. أين واسيت، وأين جرحت، وأين كان السكوت أرحم؟ اجعل استحضار المسؤولية عن القول بابًا لوعي أرفق بلسانك.</p></div></template>
<template class="message-item"><div class="verse-panel"><p class="small">سورة الذاريات · الآية ٢١</p><blockquote class="quran message-verse">وَفِيٓ أَنفُسِكُمۡۚ أَفَلَا تُبۡصِرُونَ</blockquote></div><div class="reflection"><strong>وقفة للتأمل</strong><p>في نفسك تفاصيل تعمل دون أن تنتبه إليها، وحياة لم تصنع أصلها بيدك. تأمّل نعمة واحدة في جسدك بعين الشكر. كيف يتغير تعاملك مع نفسك حين تراها أمانة؟</p></div></template>
<template class="message-item"><div class="verse-panel"><p class="small">سورة الطور · الآية ٤٨</p><blockquote class="quran message-verse">وَٱصۡبِرۡ لِحُكۡمِ رَبِّكَ فَإِنَّكَ بِأَعۡيُنِنَاۖ وَسَبِّحۡ بِحَمۡدِ رَبِّكَ حِينَ تَقُومُ</blockquote></div><div class="reflection"><strong>وقفة للتأمل</strong><p>في خطاب الله لنبيّه ما يدعو إلى تأمّل الصبر والتسبيح وسط المشقّة. اجعل للانتظار مساحة ذكر، دون أن تنكر ثقله. ما الذي تستطيع أن تحفظه في خُلُقك حتى يتبيّن الطريق؟</p></div></template>
<template class="message-item"><div class="verse-panel"><p class="small">سورة النجم · الآية ٣٩</p><blockquote class="quran message-verse">وَأَن لَّيۡسَ لِلۡإِنسَٰنِ إِلَّا مَا سَعَىٰ</blockquote></div><div class="reflection"><strong>وقفة للتأمل</strong><p>تأمّل الفرق بين أمنية تعود إلى ذهنك وسعي تترك له أثرًا في يومك. أمام الله، ما الذي تبذله فعلًا؟ اختر خطوة تستطيع الوفاء بها، ودع قيمة السعي تحرّرك من الانشغال بالمقارنة.</p></div></template>
<template class="message-item"><div class="verse-panel"><p class="small">سورة القمر · الآية ١٧</p><blockquote class="quran message-verse">وَلَقَدۡ يَسَّرۡنَا ٱلۡقُرۡءَانَ لِلذِّكۡرِ فَهَلۡ مِن مُّدَّكِرٖ</blockquote></div><div class="reflection"><strong>وقفة للتأمل</strong><p>ارجع إلى القرآن بقلب مستعدّ للتذكّر، ولو بدأت بقدر يسير. أيّ معنى يحتاج أن يعود حيًا فيك بعدما صار مألوفًا؟ اقرأ على مهل، واترك له أثرًا يتجاوز نهاية الصفحة.</p></div></template>
<template class="message-item"><div class="verse-panel"><p class="small">سورة الرحمن · الآية ١٣</p><blockquote class="quran message-verse">فَبِأَيِّ ءَالَآءِ رَبِّكُمَا تُكَذِّبَانِ</blockquote></div><div class="reflection"><strong>وقفة للتأمل</strong><p>يوقظ هذا السؤال القلب من اعتياد النعم. توقّف عند ما تملكه الآن، قبل أن يسرق الانشغال بما ينقصك رؤيته. أيّ نعمة تستحق أن تعيشها اليوم بوعي وشكر؟</p></div></template>
<template class="message-item"><div class="verse-panel"><p class="small">سورة الواقعة · الآية ٦٨</p><blockquote class="quran message-verse">أَفَرَءَيۡتُمُ ٱلۡمَآءَ ٱلَّذِي تَشۡرَبُونَ</blockquote></div><div class="reflection"><strong>وقفة للتأمل</strong><p>في شربة الماء حاجة لا يغني عنها كثير مما نطلبه. تأمّل هشاشة اكتفائنا، وسعة ما يصلنا من رزق. كيف يحمل هذا الكوب البسيط قلبك إلى الحمد؟</p></div></template>
<template class="message-item"><div class="verse-panel"><p class="small">سورة الحديد · الآية ١٨</p><blockquote class="quran message-verse">إِنَّ ٱلۡمُصَّدِّقِينَ وَٱلۡمُصَّدِّقَٰتِ وَأَقۡرَضُواْ ٱللَّهَ قَرۡضًا حَسَنٗا يُضَٰعَفُ لَهُمۡ وَلَهُمۡ أَجۡرٞ كَرِيمٞ</blockquote></div><div class="reflection"><strong>وقفة للتأمل</strong><p>تأمّل المال حين يخرج من يدك طلبًا لرضا الله. ما الذي يتحرر في قلبك حين تعطي، وما الذي يقاوم؟ اجعل رجاء الأجر يصحبه رفق بمن يصل إليه العطاء.</p></div></template>
<template class="message-item"><div class="verse-panel"><p class="small">سورة المجادلة · الآية ١١</p><blockquote class="quran message-verse">يَـٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوٓاْ إِذَا قِيلَ لَكُمۡ تَفَسَّحُواْ فِي ٱلۡمَجَٰلِسِ فَٱفۡسَحُواْ يَفۡسَحِ ٱللَّهُ لَكُمۡۖ وَإِذَا قِيلَ ٱنشُزُواْ فَٱنشُزُواْ يَرۡفَعِ ٱللَّهُ ٱلَّذِينَ ءَامَنُواْ مِنكُمۡ وَٱلَّذِينَ أُوتُواْ ٱلۡعِلۡمَ دَرَجَٰتٖۚ وَٱللَّهُ بِمَا تَعۡمَلُونَ خَبِيرٞ</blockquote></div><div class="reflection"><strong>وقفة للتأمل</strong><p>إفساح المكان عمل يسير قد يكشف اتساع القلب أو ضيقه. تأمّل من يدخل مجلسك: هل يشعر أن له موضعًا وكرامة؟ أين يحتاج اعتزازك بنفسك إلى تواضع يفسح للآخرين؟</p></div></template>
<template class="message-item"><div class="verse-panel"><p class="small">سورة الحشر · الآية ١٨</p><blockquote class="quran message-verse">يَـٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُواْ ٱتَّقُواْ ٱللَّهَ وَلۡتَنظُرۡ نَفۡسٞ مَّا قَدَّمَتۡ لِغَدٖۖ وَٱتَّقُواْ ٱللَّهَۚ إِنَّ ٱللَّهَ خَبِيرُۢ بِمَا تَعۡمَلُونَ</blockquote></div><div class="reflection"><strong>وقفة للتأمل</strong><p>انظر إلى يومك من جهة ما قدّمت، لا ما حصلت عليه فقط. أيّ أثر ترجُو أن تلقاه أمامك؟ اجعل المحاسبة صادقة ورفيقة، تقودك إلى إصلاح ممكن بدل الغرق في اللوم.</p></div></template>
<template class="message-item"><div class="verse-panel"><p class="small">سورة الممتحنة · الآية ٨</p><blockquote class="quran message-verse">لَّا يَنۡهَىٰكُمُ ٱللَّهُ عَنِ ٱلَّذِينَ لَمۡ يُقَٰتِلُوكُمۡ فِي ٱلدِّينِ وَلَمۡ يُخۡرِجُوكُم مِّن دِيَٰرِكُمۡ أَن تَبَرُّوهُمۡ وَتُقۡسِطُوٓاْ إِلَيۡهِمۡۚ إِنَّ ٱللَّهَ يُحِبُّ ٱلۡمُقۡسِطِينَ</blockquote></div><div class="reflection"><strong>وقفة للتأمل</strong><p>تأمّل قدرتك على البرّ والعدل مع من يختلف عنك. هل يبقى إنصافك حاضرًا حين يغيب التشابه؟ في تفاصيل المعاملة يظهر ما تمنحه للإنسان من حق وكرامة.</p></div></template>
<template class="message-item"><div class="verse-panel"><p class="small">سورة الصف · الآية ٢</p><blockquote class="quran message-verse">يَـٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُواْ لِمَ تَقُولُونَ مَا لَا تَفۡعَلُونَ</blockquote></div><div class="reflection"><strong>وقفة للتأمل</strong><p>قد تكبر المسافة بين الكلام والعمل دون أن نشعر. تأمّل وعدًا تحب أن يصدّقه الآخرون فيك: هل يجدونه في فعلك؟ اختر موضعًا واحدًا تجمع فيه قولك وسلوكك بصدق.</p></div></template>
<template class="message-item"><div class="verse-panel"><p class="small">سورة الجمعة · الآية ١٠</p><blockquote class="quran message-verse">فَإِذَا قُضِيَتِ ٱلصَّلَوٰةُ فَٱنتَشِرُواْ فِي ٱلۡأَرۡضِ وَٱبۡتَغُواْ مِن فَضۡلِ ٱللَّهِ وَٱذۡكُرُواْ ٱللَّهَ كَثِيرٗا لَّعَلَّكُمۡ تُفۡلِحُونَ</blockquote></div><div class="reflection"><strong>وقفة للتأمل</strong><p>وأنت تسعى للرزق، تأمّل مكان ذكر الله في زحام الأسباب. هل يصحبك في أمانتك وقرارك كما يصحب لسانك؟ امنح العمل نيّة تحفظ له معناه وسط التعب.</p></div></template>
<template class="message-item"><div class="verse-panel"><p class="small">سورة المنافقون · الآية ١٠</p><blockquote class="quran message-verse">وَأَنفِقُواْ مِن مَّا رَزَقۡنَٰكُم مِّن قَبۡلِ أَن يَأۡتِيَ أَحَدَكُمُ ٱلۡمَوۡتُ فَيَقُولَ رَبِّ لَوۡلَآ أَخَّرۡتَنِيٓ إِلَىٰٓ أَجَلٖ قَرِيبٖ فَأَصَّدَّقَ وَأَكُن مِّنَ ٱلصَّـٰلِحِينَ</blockquote></div><div class="reflection"><strong>وقفة للتأمل</strong><p>للتأجيل قدرة على جعل الخير الممكن يبدو بعيدًا. تأمّل عطاءً ما زلت تقول عنه: لاحقًا. ما الذي تستطيع بذله الآن وأنت تملك فرصة الاختيار؟</p></div></template>
<template class="message-item"><div class="verse-panel"><p class="small">سورة التغابن · الآية ١٦</p><blockquote class="quran message-verse">فَٱتَّقُواْ ٱللَّهَ مَا ٱسۡتَطَعۡتُمۡ وَٱسۡمَعُواْ وَأَطِيعُواْ وَأَنفِقُواْ خَيۡرٗا لِّأَنفُسِكُمۡۗ وَمَن يُوقَ شُحَّ نَفۡسِهِۦ فَأُوْلَـٰٓئِكَ هُمُ ٱلۡمُفۡلِحُونَ</blockquote></div><div class="reflection"><strong>وقفة للتأمل</strong><p>تأمّل حدود استطاعتك بصدق: ما الذي تعجز عنه، وما الذي تؤجّله رغم قدرتك؟ ابدأ بالطاعة الممكنة. اجمع الرحمة بنفسك مع الأمانة في بذل وسعك.</p></div></template>
<template class="message-item"><div class="verse-panel"><p class="small">سورة الطلاق · الآية ٣</p><blockquote class="quran message-verse">وَيَرۡزُقۡهُ مِنۡ حَيۡثُ لَا يَحۡتَسِبُۚ وَمَن يَتَوَكَّلۡ عَلَى ٱللَّهِ فَهُوَ حَسۡبُهُۥٓۚ إِنَّ ٱللَّهَ بَٰلِغُ أَمۡرِهِۦۚ قَدۡ جَعَلَ ٱللَّهُ لِكُلِّ شَيۡءٖ قَدۡرٗا</blockquote></div><div class="reflection"><strong>وقفة للتأمل</strong><p>قد يتعلّق القلب بالأسباب حتى يظن أن الرزق محصور في باب واحد. تأمّل توكّلك وأنت تسعى: كيف تبذل جهدك وتترك لله ما لا تملكه من النتائج؟</p></div></template>
<template class="message-item"><div class="verse-panel"><p class="small">سورة التحريم · الآية ٨</p><blockquote class="quran message-verse">يَـٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُواْ تُوبُوٓاْ إِلَى ٱللَّهِ تَوۡبَةٗ نَّصُوحًا عَسَىٰ رَبُّكُمۡ أَن يُكَفِّرَ عَنكُمۡ سَيِّـَٔاتِكُمۡ وَيُدۡخِلَكُمۡ جَنَّـٰتٖ تَجۡرِي مِن تَحۡتِهَا ٱلۡأَنۡهَٰرُ يَوۡمَ لَا يُخۡزِي ٱللَّهُ ٱلنَّبِيَّ وَٱلَّذِينَ ءَامَنُواْ مَعَهُۥۖ نُورُهُمۡ يَسۡعَىٰ بَيۡنَ أَيۡدِيهِمۡ وَبِأَيۡمَٰنِهِمۡ يَقُولُونَ رَبَّنَآ أَتۡمِمۡ لَنَا نُورَنَا وَٱغۡفِرۡ لَنَآۖ إِنَّكَ عَلَىٰ كُلِّ شَيۡءٖ قَدِيرٞ</blockquote></div><div class="reflection"><strong>وقفة للتأمل</strong><p>التوبة الصادقة لحظة تتبعها اختيارات. تأمّل ما تريد أن ترجع عنه، ثم اسأل عن الحق الذي يحتاج ردًّا والعادة التي تحتاج تغييرًا. ما الخطوة التي تجعل رجوعك أصدق من مجرّد الندم؟</p></div></template>
<template class="message-item"><div class="verse-panel"><p class="small">سورة الملك · الآية ١٥</p><blockquote class="quran message-verse">هُوَ ٱلَّذِي جَعَلَ لَكُمُ ٱلۡأَرۡضَ ذَلُولٗا فَٱمۡشُواْ فِي مَنَاكِبِهَا وَكُلُواْ مِن رِّزۡقِهِۦۖ وَإِلَيۡهِ ٱلنُّشُورُ</blockquote></div><div class="reflection"><strong>وقفة للتأمل</strong><p>تمشي في الأرض وتسعى، ثم تذكّرك الآية بالنشور. تأمّل وجهة الكسب ووجهة المصير معًا. كيف يصبح رزقك أطيب حين يصحبه وعي بما ستُسأل عنه؟</p></div></template>
<template class="message-item"><div class="verse-panel"><p class="small">سورة القلم · الآية ٤</p><blockquote class="quran message-verse">وَإِنَّكَ لَعَلَىٰ خُلُقٍ عَظِيمٖ</blockquote></div><div class="reflection"><strong>وقفة للتأمل</strong><p>تأمّل الخُلُق في المواضع التي يصعب فيها التصنّع: مع الضعيف، وفي الغضب، وعند القدرة. أيّ صفة من أخلاق النبي ﷺ تحتاج أن تمنحها عملًا في يومك؟</p></div></template>
<template class="message-item"><div class="verse-panel"><p class="small">سورة الحاقة · الآية ٢٤</p><blockquote class="quran message-verse">كُلُواْ وَٱشۡرَبُواْ هَنِيٓـَٔۢا بِمَآ أَسۡلَفۡتُمۡ فِي ٱلۡأَيَّامِ ٱلۡخَالِيَةِ</blockquote></div><div class="reflection"><strong>وقفة للتأمل</strong><p>تأمّل فرحة ثمرة العمل حين يأتي وقتها. ما الذي ترغب أن تنظر إليه من أيامك الماضية برضا؟ امنح هذا اليوم شيئًا من الخير الذي ترجُو أن تلقاه في آخرتك.</p></div></template>
<template class="message-item"><div class="verse-panel"><p class="small">سورة المعارج · الآية ٢٣</p><blockquote class="quran message-verse">ٱلَّذِينَ هُمۡ عَلَىٰ صَلَاتِهِمۡ دَآئِمُونَ</blockquote></div><div class="reflection"><strong>وقفة للتأمل</strong><p>الدوام على الصلاة يمرّ بأيام نشاط وأيام فتور. تأمّل ما يعين صلتك بالله حين تخفّ الحماسة. كيف تجعل العودة إلى الصلاة جزءًا ثابتًا من يومك؟</p></div></template>
<template class="message-item"><div class="verse-panel"><p class="small">سورة نوح · الآية ١٠</p><blockquote class="quran message-verse">فَقُلۡتُ ٱسۡتَغۡفِرُواْ رَبَّكُمۡ إِنَّهُۥ كَانَ غَفَّارٗا</blockquote></div><div class="reflection"><strong>وقفة للتأمل</strong><p>في الاستغفار اعتراف بالحاجة إلى المغفرة، لا مجرّد ألفاظ معتادة. تأمّل موضع تقصيرك وأنت تطلب العفو. ما الأثر الذي يستطيع صدق الاستغفار أن يتركه في قرارك القادم؟</p></div></template>
<template class="message-item"><div class="verse-panel"><p class="small">سورة الجن · الآية ١٨</p><blockquote class="quran message-verse">وَأَنَّ ٱلۡمَسَٰجِدَ لِلَّهِ فَلَا تَدۡعُواْ مَعَ ٱللَّهِ أَحَدٗا</blockquote></div><div class="reflection"><strong>وقفة للتأمل</strong><p>أقبل على الله وحده وأنت تدعو، وتأمّل ما يستند إليه قلبك في أعماقه. هل تطلب العون وأنت مستحضر عبوديتك له؟ دع التوحيد يجمع ما تشتّت من رجائك.</p></div></template>
<template class="message-item"><div class="verse-panel"><p class="small">سورة المزمل · الآية ٨</p><blockquote class="quran message-verse">وَٱذۡكُرِ ٱسۡمَ رَبِّكَ وَتَبَتَّلۡ إِلَيۡهِ تَبۡتِيلٗا</blockquote></div><div class="reflection"><strong>وقفة للتأمل</strong><p>قد تمتلئ ساعاتك بالأصوات حتى لا تسمع ما في قلبك. اقتطع وقتًا لذكر الله والإقبال عليه. ما الذي يظهر من حاجتك حين يهدأ ما حولك؟</p></div></template>
<template class="message-item"><div class="verse-panel"><p class="small">سورة المدثر · الآية ٤</p><blockquote class="quran message-verse">وَثِيَابَكَ فَطَهِّرۡ</blockquote></div><div class="reflection"><strong>وقفة للتأمل</strong><p>تأمّل العناية بالطهارة في التفاصيل القريبة التي قد تؤجلها. كيف تهيّئ نفسك للعبادة بحضور واهتمام؟ اجعل هذا الاستعداد فرصة تنتقل فيها من العجلة إلى الانتباه.</p></div></template>
<template class="message-item"><div class="verse-panel"><p class="small">سورة القيامة · الآية ١٤</p><blockquote class="quran message-verse">بَلِ ٱلۡإِنسَٰنُ عَلَىٰ نَفۡسِهِۦ بَصِيرَةٞ</blockquote></div><div class="reflection"><strong>وقفة للتأمل</strong><p>هناك حقيقة عن نفسك تعرفها قبل شرحك لها أمام الناس. اجلس معها برفق وصدق. ما الذي يحتاج منك اعترافًا يفتح باب الإصلاح، بدل عذر يحفظ الصورة ويترك الخلل؟</p></div></template>
<template class="message-item"><div class="verse-panel"><p class="small">سورة الانسان · الآية ٩</p><blockquote class="quran message-verse">إِنَّمَا نُطۡعِمُكُمۡ لِوَجۡهِ ٱللَّهِ لَا نُرِيدُ مِنكُمۡ جَزَآءٗ وَلَا شُكُورًا</blockquote></div><div class="reflection"><strong>وقفة للتأمل</strong><p>تأمّل نيّتك إذا مرّ معروفك دون شكر. هل تستطيع أن تترك لمن أعنته حريته، وألّا تربطه بدَين عاطفي؟ اجعل رجاء وجه الله حاضرًا عند العطاء وبعده.</p></div></template>
<template class="message-item"><div class="verse-panel"><p class="small">سورة المرسلات · الآية ٢٥</p><blockquote class="quran message-verse">أَلَمۡ نَجۡعَلِ ٱلۡأَرۡضَ كِفَاتًا</blockquote></div><div class="reflection"><strong>وقفة للتأمل</strong><p>الأرض تحمل خطواتنا وحياتنا، ويضمّ ترابها من سبقونا. تأمّل قصر مقامك فيها وما تتركه عليها. أيّ أثر من الرحمة تريد أن يمرّ من حياتك إلى غيرك؟</p></div></template>
<template class="message-item"><div class="verse-panel"><p class="small">سورة النبإ · الآية ٩</p><blockquote class="quran message-verse">وَجَعَلۡنَا نَوۡمَكُمۡ سُبَاتٗا</blockquote></div><div class="reflection"><strong>وقفة للتأمل</strong><p>عند النوم تتوقف عن تدبير كثير مما يشغلك، وتحتاج إلى الراحة. تأمّل هذه الحاجة برحمة مع نفسك. ما الذي تستطيع أن تتركه إلى الغد وأنت تختم يومك بالحمد؟</p></div></template>
<template class="message-item"><div class="verse-panel"><p class="small">سورة النازعات · الآية ٤٠</p><blockquote class="quran message-verse">وَأَمَّا مَنۡ خَافَ مَقَامَ رَبِّهِۦ وَنَهَى ٱلنَّفۡسَ عَنِ ٱلۡهَوَىٰ</blockquote></div><div class="reflection"><strong>وقفة للتأمل</strong><p>تأمّل الرغبة حين تقف أمام ما تعلم أنه حق. في تلك اللحظة الصغيرة تتربّى النفس على الاختيار. أيّ هوى تحتاج أن تهذّبه، مستحضرًا وقوفك بين يدي ربك؟</p></div></template>
<template class="message-item"><div class="verse-panel"><p class="small">سورة عبس · الآية ٢٤</p><blockquote class="quran message-verse">فَلۡيَنظُرِ ٱلۡإِنسَٰنُ إِلَىٰ طَعَامِهِۦٓ</blockquote></div><div class="reflection"><strong>وقفة للتأمل</strong><p>قبل أن تمدّ يدك إلى الطعام، تأمّل الطريق الذي وصل به إليك. ما الذي يغيّره هذا النظر في شهيتك للاستهلاك وفي إحساسك بالمحتاج؟ دع المائدة توقظ الشكر.</p></div></template>
<template class="message-item"><div class="verse-panel"><p class="small">سورة التكوير · الآية ٢٩</p><blockquote class="quran message-verse">وَمَا تَشَآءُونَ إِلَّآ أَن يَشَآءَ ٱللَّهُ رَبُّ ٱلۡعَٰلَمِينَ</blockquote></div><div class="reflection"><strong>وقفة للتأمل</strong><p>تأمّل إرادتك داخل افتقارك إلى الله. تخطّط وتختار وتبذل، وتطلب منه التوفيق في كل ذلك. كيف يصحب التواضع عزيمتك حين تنجح أو يتغيّر الطريق؟</p></div></template>
<template class="message-item"><div class="verse-panel"><p class="small">سورة الإنفطار · الآية ٨</p><blockquote class="quran message-verse">فِيٓ أَيِّ صُورَةٖ مَّا شَآءَ رَكَّبَكَ</blockquote></div><div class="reflection"><strong>وقفة للتأمل</strong><p>تأمّل خلقك بعيدًا عن قسوة المقارنة. في صورتك حياة وتكوين يدعوان إلى الشكر والتواضع. كيف ترعى ما وهبك الله دون أن تجعل قيمتك رهينة نظرة الناس؟</p></div></template>
<template class="message-item"><div class="verse-panel"><p class="small">سورة المطففين · الآية ٣</p><blockquote class="quran message-verse">وَإِذَا كَالُوهُمۡ أَو وَّزَنُوهُمۡ يُخۡسِرُونَ</blockquote></div><div class="reflection"><strong>وقفة للتأمل</strong><p>قد ننتبه إلى نقص حقوقنا أكثر مما ننتبه إلى نقص ما نؤدّيه. تأمّل ميزانك مع الآخرين: هل يرضيك أن يعاملوك بالدقّة نفسها؟ أين يحتاج إنصافك إلى مراجعة؟</p></div></template>
<template class="message-item"><div class="verse-panel"><p class="small">سورة الإنشقاق · الآية ٦</p><blockquote class="quran message-verse">يَـٰٓأَيُّهَا ٱلۡإِنسَٰنُ إِنَّكَ كَادِحٌ إِلَىٰ رَبِّكَ كَدۡحٗا فَمُلَٰقِيهِ</blockquote></div><div class="reflection"><strong>وقفة للتأمل</strong><p>يمضي الإنسان في كدحه، وتضع الآية أمامه غاية أبعد من نهاية يومه. تأمّل ما يستحق أن تحمل لأجله هذا التعب. بأيّ عمل تحب أن تلقى ربك؟</p></div></template>
<template class="message-item"><div class="verse-panel"><p class="small">سورة البروج · الآية ١٤</p><blockquote class="quran message-verse">وَهُوَ ٱلۡغَفُورُ ٱلۡوَدُودُ</blockquote></div><div class="reflection"><strong>وقفة للتأمل</strong><p>تأمّل اسمي الله الغفور والودود وأنت تحمل تقصيرك ورجاءك. ما الذي يدعوك إلى العودة حين تستحضرهما؟ امنح الرجاء أثرًا في توبتك وطريقة معاملتك للناس.</p></div></template>
<template class="message-item"><div class="verse-panel"><p class="small">سورة الطارق · الآية ٥</p><blockquote class="quran message-verse">فَلۡيَنظُرِ ٱلۡإِنسَٰنُ مِمَّ خُلِقَ</blockquote></div><div class="reflection"><strong>وقفة للتأمل</strong><p>يردّك التأمّل في أصل خلقك إلى حقيقة الافتقار. ما الذي يبقى من التعالي حين تتذكر البداية؟ دع هذا النظر يرقّق حكمك على الناس ويوقظ تواضعك.</p></div></template>
<template class="message-item"><div class="verse-panel"><p class="small">سورة الأعلى · الآية ١</p><blockquote class="quran message-verse">سَبِّحِ ٱسۡمَ رَبِّكَ ٱلۡأَعۡلَى</blockquote></div><div class="reflection"><strong>وقفة للتأمل</strong><p>حين تسبّح، أمهل قلبك ليستحضر تنزيه الله وعظمته. ما الذي يتضاءل من غرورك أو استحواذ همّك أمام هذا المعنى؟ اجعل الذكر لحظة حضور تستعيد فيها وجهتك.</p></div></template>
<template class="message-item"><div class="verse-panel"><p class="small">سورة الغاشية · الآية ١٧</p><blockquote class="quran message-verse">أَفَلَا يَنظُرُونَ إِلَى ٱلۡإِبِلِ كَيۡفَ خُلِقَتۡ</blockquote></div><div class="reflection"><strong>وقفة للتأمل</strong><p>أطل النظر إلى مخلوق اعتدت المرور به. تأمّل هيئته وما أودع الله فيه من خصائص. كيف يعيد النظر المتأنّي الدهشة إلى عالم ظننت أنك تعرفه؟</p></div></template>
<template class="message-item"><div class="verse-panel"><p class="small">سورة الفجر · الآية ٢٧</p><blockquote class="quran message-verse">يَـٰٓأَيَّتُهَا ٱلنَّفۡسُ ٱلۡمُطۡمَئِنَّةُ</blockquote></div><div class="reflection"><strong>وقفة للتأمل</strong><p>تأمّل نداء النفس المطمئنّة، وما يوقظه فيك من شوق إلى لقاء الله بقلب راضٍ. أيّ تعلّق يشغلك عن هذا الرجاء؟ وما الذي يغذّي إيمانك في تفاصيل اليوم؟</p></div></template>
<template class="message-item"><div class="verse-panel"><p class="small">سورة البلد · الآية ١٤</p><blockquote class="quran message-verse">أَوۡ إِطۡعَٰمٞ فِي يَوۡمٖ ذِي مَسۡغَبَةٖ</blockquote></div><div class="reflection"><strong>وقفة للتأمل</strong><p>تزداد قيمة العطاء حين تشتدّ الحاجة من حوله. تأمّل الجوع بوصفه تجربة إنسان، لا رقمًا بعيدًا. ما النصيب الذي تستطيع أن تجعله لغيرك من وفرة يومك؟</p></div></template>
<template class="message-item"><div class="verse-panel"><p class="small">سورة الشمس · الآية ٩</p><blockquote class="quran message-verse">قَدۡ أَفۡلَحَ مَن زَكَّىٰهَا</blockquote></div><div class="reflection"><strong>وقفة للتأمل</strong><p>تزكية النفس تحتاج رؤية ما فيها ورعاية ما يصلحها. تأمّل خُلُقًا ينمو فيك بصمت، خيرًا كان أو مؤذيًا. أيّ اختيار صغير تكرّره حتى تصبح أقرب إلى ما ترجو؟</p></div></template>
<template class="message-item"><div class="verse-panel"><p class="small">سورة الليل · الآية ١٨</p><blockquote class="quran message-verse">ٱلَّذِي يُؤۡتِي مَالَهُۥ يَتَزَكَّىٰ</blockquote></div><div class="reflection"><strong>وقفة للتأمل</strong><p>تأمّل أثر العطاء في تعلّقك بما تملك. حين تبذل طالبًا التزكّي، ما الذي تتعلّم تركه من منّ أو رياء؟ امنح صدقتك قلبًا يحسن نيّتها ويحفظ كرامة صاحب الحاجة.</p></div></template>
<template class="message-item"><div class="verse-panel"><p class="small">سورة الضحى · الآية ١٠</p><blockquote class="quran message-verse">وَأَمَّا ٱلسَّآئِلَ فَلَا تَنۡهَرۡ</blockquote></div><div class="reflection"><strong>وقفة للتأمل</strong><p>قد يأتي السؤال من إنسان أثقلته حاجته قبل أن يتكلم. تأمّل أثر نبرتك عليه، حتى إن لم تستطع إعطاءه. كيف تجعل جوابك خاليًا من الإهانة؟</p></div></template>
<template class="message-item"><div class="verse-panel"><p class="small">سورة الشرح · الآية ٥</p><blockquote class="quran message-verse">فَإِنَّ مَعَ ٱلۡعُسۡرِ يُسۡرًا</blockquote></div><div class="reflection"><strong>وقفة للتأمل</strong><p>تأمّل اليسر الذي تقرنه الآية بالعسر، دون أن تنكر وجع ما تعيش. قد تحتاج أن توسّع نظرك لما بقي من عون ورحمة. ما الذي يسند خطوتك الآن، ولو لم يزل كلّ التعب؟</p></div></template>
<template class="message-item"><div class="verse-panel"><p class="small">سورة التين · الآية ٤</p><blockquote class="quran message-verse">لَقَدۡ خَلَقۡنَا ٱلۡإِنسَٰنَ فِيٓ أَحۡسَنِ تَقۡوِيمٖ</blockquote></div><div class="reflection"><strong>وقفة للتأمل</strong><p>تأمّل نعمة الخلق وما تستدعيه من شكر ومسؤولية. كيف تحفظ كرامتك وكرامة غيرك في ضوء هذا المعنى؟ امنح نفسك رعاية لا تقوم على المقارنة أو احتقار النقص.</p></div></template>
<template class="message-item"><div class="verse-panel"><p class="small">سورة العلق · الآية ١٩</p><blockquote class="quran message-verse">كَلَّا لَا تُطِعۡهُ وَٱسۡجُدۡۤ وَٱقۡتَرِب۩</blockquote></div><div class="reflection"><strong>وقفة للتأمل</strong><p>في السجود يقترب معنى العبودية من الجسد والقلب معًا. أطل حضورك دون تكلّف شعور بعينه. ما الذي ترغب أن تضعه في دعائك وأنت في هذا الموضع من الافتقار؟</p></div></template>
<template class="message-item"><div class="verse-panel"><p class="small">سورة القدر · الآية ٣</p><blockquote class="quran message-verse">لَيۡلَةُ ٱلۡقَدۡرِ خَيۡرٞ مِّنۡ أَلۡفِ شَهۡرٖ</blockquote></div><div class="reflection"><strong>وقفة للتأمل</strong><p>تأمّل كيف تتجاوز قيمة ليلة حدود عدد ساعاتها. ما الذي يعلّمك ذلك عن اغتنام مواسم العبادة؟ اطلب فضل الله بقلب حاضر، وأعد النظر في الوقت الذي يمرّ منك غافلًا.</p></div></template>
<template class="message-item"><div class="verse-panel"><p class="small">سورة البينة · الآية ٥</p><blockquote class="quran message-verse">وَمَآ أُمِرُوٓاْ إِلَّا لِيَعۡبُدُواْ ٱللَّهَ مُخۡلِصِينَ لَهُ ٱلدِّينَ حُنَفَآءَ وَيُقِيمُواْ ٱلصَّلَوٰةَ وَيُؤۡتُواْ ٱلزَّكَوٰةَۚ وَذَٰلِكَ دِينُ ٱلۡقَيِّمَةِ</blockquote></div><div class="reflection"><strong>وقفة للتأمل</strong><p>قد يتشابه العمل في ظاهره وتختلف النيّة التي تحمله. اسأل قلبك بهدوء: لمن أفعل هذا؟ وما الذي يتغيّر في عبادتي لو لم يعلم بها أحد؟</p></div></template>
<template class="message-item"><div class="verse-panel"><p class="small">سورة الزلزلة · الآية ٧</p><blockquote class="quran message-verse">فَمَن يَعۡمَلۡ مِثۡقَالَ ذَرَّةٍ خَيۡرٗا يَرَهُۥ</blockquote></div><div class="reflection"><strong>وقفة للتأمل</strong><p>تأمّل ميزانًا لا يضيع فيه مثقال ذرّة من الخير. ما المعروف الذي احتقرته لصغره أو لقلة من يراه؟ امنحه فرصة أن يوجد، واترك حساب أثره لله.</p></div></template>
<template class="message-item"><div class="verse-panel"><p class="small">سورة العاديات · الآية ٨</p><blockquote class="quran message-verse">وَإِنَّهُۥ لِحُبِّ ٱلۡخَيۡرِ لَشَدِيدٌ</blockquote></div><div class="reflection"><strong>وقفة للتأمل</strong><p>راقب حبّ المال حين يقترب من موضع القرار. هل يحمل همّ الأمان، أم أصبح يزاحم حقًا تعرفه؟ تأمّل كيف تستعمل ما تملك دون أن يستولي على قلبك.</p></div></template>
<template class="message-item"><div class="verse-panel"><p class="small">سورة القارعة · الآية ٦</p><blockquote class="quran message-verse">فَأَمَّا مَن ثَقُلَتۡ مَوَٰزِينُهُۥ</blockquote></div><div class="reflection"><strong>وقفة للتأمل</strong><p>تأمّل الميزان وأنت تختار ما تمنحه من وقتك وقلبك. أيّ عمل ترجُو ثقله عند الله، ولو بدا خفيفًا في أعين الناس؟ اجعل لهذا الرجاء نصيبًا في يومك.</p></div></template>
<template class="message-item"><div class="verse-panel"><p class="small">سورة التكاثر · الآية ٨</p><blockquote class="quran message-verse">ثُمَّ لَتُسۡـَٔلُنَّ يَوۡمَئِذٍ عَنِ ٱلنَّعِيمِ</blockquote></div><div class="reflection"><strong>وقفة للتأمل</strong><p>النعمة تحمل سؤالًا عن طريقة عيشها. تأمّل ما تستمتع به اليوم من وقت أو صحة أو رزق: أين صرفته؟ كيف تجعل الشكر جوابًا يظهر في استعمالك له؟</p></div></template>
<template class="message-item"><div class="verse-panel"><p class="small">سورة العصر · الآية ٣</p><blockquote class="quran message-verse">إِلَّا ٱلَّذِينَ ءَامَنُواْ وَعَمِلُواْ ٱلصَّـٰلِحَٰتِ وَتَوَاصَوۡاْ بِٱلۡحَقِّ وَتَوَاصَوۡاْ بِٱلصَّبۡرِ</blockquote></div><div class="reflection"><strong>وقفة للتأمل</strong><p>في التواصي بالحق والصبر صحبة تعين على الطريق. تأمّل من يحتاج منك كلمة صادقة رفيقة، ومن تحتاج أنت إلى نصحه. هل تسمح للعلاقة أن تصلحك كما تواسيك؟</p></div></template>
<template class="message-item"><div class="verse-panel"><p class="small">سورة الهمزة · الآية ١</p><blockquote class="quran message-verse">وَيۡلٞ لِّكُلِّ هُمَزَةٖ لُّمَزَةٍ</blockquote></div><div class="reflection"><strong>وقفة للتأمل</strong><p>قد تختبئ القسوة في مزحة أو إشارة عابرة. تأمّل ما يفعله كلامك بصورة الإنسان في أعين الآخرين. أيّ عادة في الحديث تحتاج أن تتركها حتى يسلم الناس من لسانك؟</p></div></template>
<template class="message-item"><div class="verse-panel"><p class="small">سورة الفيل · الآية ١</p><blockquote class="quran message-verse">أَلَمۡ تَرَ كَيۡفَ فَعَلَ رَبُّكَ بِأَصۡحَٰبِ ٱلۡفِيلِ</blockquote></div><div class="reflection"><strong>وقفة للتأمل</strong><p>تأمّل قصة أصحاب الفيل وما تكشفه عن حدود القوة التي يغترّ بها الإنسان. أين جعلت للمظاهر سلطانًا أكبر مما تستحق في قلبك؟ استحضر قدرة الله دون أن تتوقف عن الأخذ بالأسباب.</p></div></template>
<template class="message-item"><div class="verse-panel"><p class="small">سورة قريش · الآية ٤</p><blockquote class="quran message-verse">ٱلَّذِيٓ أَطۡعَمَهُم مِّن جُوعٖ وَءَامَنَهُم مِّنۡ خَوۡفِۭ</blockquote></div><div class="reflection"><strong>وقفة للتأمل</strong><p>قد نبحث عن المزيد ونحن نعيش نعمتَي الطعام والأمان. تأمّل حضورهما في يومك، وحاجة من فقدهما. كيف يتحول امتنانك إلى عبادة وإحسان؟</p></div></template>
<template class="message-item"><div class="verse-panel"><p class="small">سورة الماعون · الآية ٧</p><blockquote class="quran message-verse">وَيَمۡنَعُونَ ٱلۡمَاعُونَ</blockquote></div><div class="reflection"><strong>وقفة للتأمل</strong><p>من الخير ما يتجسّد في حاجة يسيرة تعين عليها جارك أو قريبك. تأمّل ما يمنعك أحيانًا: انشغال أم شحّ أم غفلة؟ افتح في يومك مساحة لنفع لا يحتاج ضجيجًا.</p></div></template>
<template class="message-item"><div class="verse-panel"><p class="small">سورة الكوثر · الآية ٢</p><blockquote class="quran message-verse">فَصَلِّ لِرَبِّكَ وَٱنۡحَرۡ</blockquote></div><div class="reflection"><strong>وقفة للتأمل</strong><p>تأمّل وجهة عبادتك وأنت تقوم للصلاة أو تبذل من مالك. ما الذي يجمع النيّة حين تتوزع بين رضا الله ونظر الناس؟ أعد قلبك برفق إلى من تعبده.</p></div></template>
<template class="message-item"><div class="verse-panel"><p class="small">سورة الكافرون · الآية ٦</p><blockquote class="quran message-verse">لَكُمۡ دِينُكُمۡ وَلِيَ دِينِ</blockquote></div><div class="reflection"><strong>وقفة للتأمل</strong><p>في وضوح العبادة ثبات يحتاج معرفة وصدقًا. تأمّل ما تختاره إرضاءً للناس على حساب قناعتك الدينية. كيف تحفظ ثباتك مع حسن المعاملة واحترام كرامة الآخرين؟</p></div></template>
<template class="message-item"><div class="verse-panel"><p class="small">سورة النصر · الآية ٣</p><blockquote class="quran message-verse">فَسَبِّحۡ بِحَمۡدِ رَبِّكَ وَٱسۡتَغۡفِرۡهُۚ إِنَّهُۥ كَانَ تَوَّابَۢا</blockquote></div><div class="reflection"><strong>وقفة للتأمل</strong><p>عند الفرح بالإنجاز، تفتح الآية باب الحمد والاستغفار. تأمّل النعمة وما صاحب سعيك من تقصير. كيف يوسّعك النجاح شكرًا وتواضعًا بدل أن يغلقك على الإعجاب بنفسك؟</p></div></template>
<template class="message-item"><div class="verse-panel"><p class="small">سورة المسد · الآية ٢</p><blockquote class="quran message-verse">مَآ أَغۡنَىٰ عَنۡهُ مَالُهُۥ وَمَا كَسَبَ</blockquote></div><div class="reflection"><strong>وقفة للتأمل</strong><p>تأمّل حدود المال وما يعجز عن دفعه عن صاحبه. ما الذي تبنيه لنفسك خارج دائرة الامتلاك؟ اجعل في سعيك عملًا صالحًا لا تختصره قيمة ما تجمع.</p></div></template>
<template class="message-item"><div class="verse-panel"><p class="small">سورة الإخلاص · الآية ١</p><blockquote class="quran message-verse">قُلۡ هُوَ ٱللَّهُ أَحَدٌ</blockquote></div><div class="reflection"><strong>وقفة للتأمل</strong><p>تأمّل معنى أن الله أحد، وما يدعوك إليه من إخلاص وجهتك له. أين تفرّق قلبك بين ما يرجوه وما يخشاه؟ اقرأ السورة وأنت تستعيد وضوح من تعبده وتدعوه.</p></div></template>
<template class="message-item"><div class="verse-panel"><p class="small">سورة الفلق · الآية ١</p><blockquote class="quran message-verse">قُلۡ أَعُوذُ بِرَبِّ ٱلۡفَلَقِ</blockquote></div><div class="reflection"><strong>وقفة للتأمل</strong><p>توجّه إلى رب الفلق وأنت تستعيذ من الشرّ. تأمّل افتقارك إلى الحماية، وخذ ما تستطيع من أسبابها. أيّ خوف تستطيع أن تعبّر عنه في دعائك دون أن تمنحه قيادة يومك؟</p></div></template>
<template class="message-item"><div class="verse-panel"><p class="small">سورة الناس · الآية ١</p><blockquote class="quran message-verse">قُلۡ أَعُوذُ بِرَبِّ ٱلنَّاسِ</blockquote></div><div class="reflection"><strong>وقفة للتأمل</strong><p>اقرأ السورة على مهل، وتأمّل استعاذتك برب الناس وملكهم وإلههم. حين تلحّ فكرة مزعجة، لا تجعل ورودها حكمًا على حقيقتك. عد إلى الاستعاذة، وإلى ما يعينك على الحضور والهدوء.</p></div></template></section></main><nav class="bottom-nav" aria-label="التنقل"><a href="/"><span class="fur-action fa-back" aria-hidden="true"></span>الرجوع للرئيسية</a></nav><script src="/message.js?v=2"></script><script src="/analytics.js?v=37" defer></script></body></html>
